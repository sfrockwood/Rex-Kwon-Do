<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Website Timer Blocker</h2>
    
    <div class="section">
      <h3>Blocked Websites</h3>
      <div id="websites-list"></div>
      <div class="add-website">
        <input type="text" id="new-website" placeholder="example.com">
        <input type="number" id="new-time" placeholder="30" min="1" max="3600">
        <span class="time-label">seconds</span>
        <button id="add-website">Add</button>
      </div>
    </div>
    
    <div class="section">
      <h3>Default Settings</h3>
      <div class="setting">
        <label for="default-time">Default time limit:</label>
        <input type="number" id="default-time" min="1" max="3600" value="30">
        <span>seconds</span>
      </div>
    </div>
    
    <div class="section">
      <button id="save-settings" class="save-btn">Save Settings</button>
      <div id="status" class="status"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
